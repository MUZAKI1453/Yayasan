<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YPI Baitussalam</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }

        /* Card Ultra Minimalis */
        .minimal-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.03);
        }

        /* Logo Di Dalam Card */
        .logo-box {
            max-height: 75px;
            width: auto;
            object-fit: contain;
        }

        /* Status Badge Soft */
        .badge-status {
            background-color: #f0fdf4;
            color: #15803d;
            border: 1px solid #dcfce7;
            font-size: 0.75rem;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 p-3">

    <div class="container" style="max-width: 420px;">
        <div class="card minimal-card p-4 p-sm-5 text-center">

            <!-- 1. LOGO YAYASAN DI DALAM KOTAK (FOKUS UTAMA) -->
            <div class="mb-4">
                <img src="{{ url_for('static', filename='img/logo_yayasan.png') }}"
                     alt="YPI Baitussalam Logo"
                     class="logo-box"
                     onerror="this.onerror=null; this.src='https://via.placeholder.com/80x80?text=YPI';">
            </div>

            <!-- 2. STATUS INDIKATOR SOFT -->
            <div class="mb-3">
                <span class="badge badge-status rounded-pill px-3 py-1.5 fw-semibold d-inline-flex align-items-center gap-2">
                    <span class="spinner-grow spinner-grow-sm text-success" style="width: 6px; height: 6px;" role="status"></span>
                    Segera Hadir
                </span>
            </div>

            <!-- 3. KONTEN PESAN RINGKAS -->
            <h5 class="fw-bold text-dark mb-2">Program Belum Tersedia</h5>
            <p class="text-muted small mb-0 leading-relaxed" style="font-size: 0.875rem;">
                Yayasan Pendidikan Islam Baitussalam sedang menyiapkan program & campaign kebaikan terbaru.
            </p>

            <!-- 4. FOOTER SIMPLE -->
            <div class="mt-4 pt-3 border-top border-light-subtle">
                <span class="text-muted fs-8 fw-medium" style="font-size: 0.75rem;">
                    <i class="bi bi-shield-check text-success me-1"></i>YPI Baitussalam Official
                </span>
            </div>

        </div>
    </div>

</body>
</html>
