<!-- FORM KHUSUS FAQ (PERTANYAAN UMUM) -->
<form action="{{ url_for('admin.edit_section', section_id=section.id) }}" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

    <!-- JUDUL & SUBJUDUL -->
    <div class="p-3 border rounded-3 bg-light-subtle mb-4">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label fw-semibold small text-slate-700 mb-1">
                    Judul FAQ <span class="text-danger">*</span>
                </label>
                <input type="text" name="title" class="form-control form-control-sm" value="{{ section.content.get('title', 'Pertanyaan yang Sering Diajukan (FAQ)') }}" required placeholder="Contoh: Pertanyaan Populer Pendaftaran">
            </div>

            <div class="col-12">
                <label class="form-label fw-semibold small text-slate-700 mb-1">Subjudul / Deskripsi Singkat</label>
                <textarea name="subtitle" class="form-control form-control-sm" rows="2" placeholder="Temukan jawaban cepat atas pertanyaan yang sering diajukan di sini...">{{ section.content.get('subtitle', '') }}</textarea>
            </div>
        </div>
    </div>

    <!-- DAFTAR ITEM FAQ -->
    <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
                <span class="fw-bold text-dark small d-block">Daftar Pertanyaan & Jawaban</span>
                <span class="text-muted" style="font-size: 0.72rem;">Tambahkan pasangan pertanyaan dan jawaban singkat</span>
            </div>
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addFaqRow()">
                <i class="bi bi-plus-lg me-1"></i>Tambah Pertanyaan
            </button>
        </div>

        <div id="faq-container" class="d-flex flex-column gap-3">
            {% set items = section.content.get('items', section.content.get('faqs', [])) %}
            {% for item in items %}
                {% set loop_idx = loop.index0 %}
                <div class="p-3 border rounded-3 bg-white faq-item-card">
                    <div class="row g-2 align-items-start">
                        <div class="col-md-11">
                            <div class="mb-2">
                                <label class="form-label text-muted mb-1" style="font-size: 0.7rem;">Pertanyaan <span class="text-danger">*</span></label>
                                <input type="text" name="items[{{ loop_idx }}][question]" value="{{ item.get('question', item.get('q', '')) }}" class="form-control form-control-sm" placeholder="Contoh: Kapan pendaftaran gelombang 1 dibuka?" required>
                            </div>
                            <div>
                                <label class="form-label text-muted mb-1" style="font-size: 0.7rem;">Jawaban <span class="text-danger">*</span></label>
                                <textarea name="items[{{ loop_idx }}][answer]" class="form-control form-control-sm" rows="3" placeholder="Tuliskan jawaban yang lengkap dan meyakinkan di sini..." required>{{ item.get('answer', item.get('a', '')) }}</textarea>
                            </div>
                        </div>

                        <div class="col-md-1 text-end pt-4">
                            <button type="button" class="btn btn-sm btn-light text-danger border w-100" onclick="this.closest('.faq-item-card').remove()" title="Hapus FAQ Ini">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="d-flex gap-2 pt-3 border-top">
        <button type="submit" class="btn btn-primary px-4 fw-medium">Simpan FAQ</button>
        <a href="{{ url_for('admin.manage_section', page_id=page.id) }}" class="btn btn-light border px-4 text-secondary">Batal</a>
    </div>
</form>

<script>
    let faqCounter = {{ section.content.get('items', section.content.get('faqs', []))|length }};

    function addFaqRow() {
        const container = document.getElementById('faq-container');
        const idx = faqCounter++;
        const html = `
            <div class="p-3 border rounded-3 bg-white faq-item-card">
                <div class="row g-2 align-items-start">
                    <div class="col-md-11">
                        <div class="mb-2">
                            <label class="form-label text-muted mb-1" style="font-size: 0.7rem;">Pertanyaan <span class="text-danger">*</span></label>
                            <input type="text" name="items[${idx}][question]" class="form-control form-control-sm" placeholder="Contoh: Apa saja syarat pendaftaran?" required>
                        </div>
                        <div>
                            <label class="form-label text-muted mb-1" style="font-size: 0.7rem;">Jawaban <span class="text-danger">*</span></label>
                            <textarea name="items[${idx}][answer]" class="form-control form-control-sm" rows="3" placeholder="Tuliskan jawaban di sini..." required></textarea>
                        </div>
                    </div>

                    <div class="col-md-1 text-end pt-4">
                        <button type="button" class="btn btn-sm btn-light text-danger border w-100" onclick="this.closest('.faq-item-card').remove()" title="Hapus FAQ Ini">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
            </div>`;
        container.insertAdjacentHTML('beforeend', html);
    }
</script>
