<!-- FORM KHUSUS HERO BANNER UTAMA -->
<form action="{{ url_for('admin.edit_section', section_id=section.id) }}" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

    <!-- TEKS UTAMA & DESKRIPSI -->
    <div class="p-3 border rounded-3 bg-light-subtle mb-4">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label fw-semibold small text-slate-700 mb-1">
                    Judul Utama Hero (Headline) <span class="text-danger">*</span>
                </label>
                <input type="text" name="title" class="form-control form-control-sm" value="{{ section.content.get('title', '') }}" required placeholder="Contoh: Penerimaan Peserta Didik Baru (PPDB) 2026/2027">
            </div>

            <div class="col-12">
                <label class="form-label fw-semibold small text-slate-700 mb-1">Subjudul / Deskripsi Singkat</label>
                <textarea name="subtitle" class="form-control form-control-sm" rows="3" placeholder="Masukkan ringkasan ajakan atau keunggulan sekolah di sini...">{{ section.content.get('subtitle', '') }}</textarea>
            </div>
        </div>
    </div>

    <!-- GAMBAR BANNER / HERO IMAGE -->
    <div class="p-3 border rounded-3 bg-white mb-4">
        <label class="form-label fw-semibold small text-slate-700 mb-1">Gambar Hero / Banner Utama</label>
        <input type="file" name="image_url_file" class="form-control form-control-sm mb-2" accept="image/*">
        
        {% if section.content.get('image_url') %}
            <div class="d-flex align-items-center gap-3 p-2 bg-light border rounded-2">
                <img src="{{ section.content.get('image_url') }}" class="rounded border object-fit-cover" style="width: 100px; height: 60px;">
                <div class="lh-1">
                    <span class="d-block text-dark fw-medium small mb-1">Gambar Banner Aktif</span>
                    <span class="text-muted" style="font-size: 0.72rem;">Digunakan sebagai visual utama pada bagian atas halaman</span>
                    <input type="hidden" name="image_url" value="{{ section.content.get('image_url') }}">
                </div>
            </div>
        {% endif %}
    </div>

    <!-- TOMBOL AKSI UTAMA (CTA 1 & CTA 2) -->
    <div class="p-3 border rounded-3 bg-white mb-4">
        <span class="fw-bold text-dark small d-block mb-3">PENGATURAN TOMBOL AKSI (CALL TO ACTION)</span>
        
        <!-- CTA PRIMER -->
        <div class="row g-3 mb-3 p-2 border rounded bg-light-subtle">
            <div class="col-md-6">
                <label class="form-label fw-medium small text-slate-700">Teks Tombol Utama (Primer)</label>
                <input type="text" name="cta_primary_text" class="form-control form-control-sm" value="{{ section.content.get('cta_primary_text', section.content.get('button_text_1', '')) }}" placeholder="Contoh: Daftar Sekarang">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-medium small text-slate-700">Target Link / Section Primer</label>
                <select name="cta_primary_url" class="form-select form-select-sm" onchange="previewTargetSection(this.value)">
                    <option value="#">-- Pilih Target Section --</option>
                    {% for sec in page.sections %}
                        {% if sec.type not in ['navbar', 'footer'] %}
                            {% set sec_nav_id = sec.content.get('nav_id') or ('sec_' ~ sec.id) %}
                            {% set sec_title = sec.content.get('title') or sec.type|replace('_', ' ')|title %}
                            {% set target_url = '#' ~ sec_nav_id %}
                            <option value="{{ target_url }}" {% if section.content.get('cta_primary_url') == target_url or section.content.get('button_link_1') == target_url %}selected{% endif %}>
                                📌 {{ sec_title }} ({{ sec.type }})
                            </option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
        </div>

        <!-- CTA SEKUNDER (OPSIONAL) -->
        <div class="row g-3 p-2 border rounded bg-light-subtle">
            <div class="col-md-6">
                <label class="form-label fw-medium small text-slate-700">Teks Tombol Sekunder (Opsional)</label>
                <input type="text" name="cta_secondary_text" class="form-control form-control-sm" value="{{ section.content.get('cta_secondary_text', section.content.get('button_text_2', '')) }}" placeholder="Contoh: Lihat Fasilitas">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-medium small text-slate-700">Target Link / Section Sekunder</label>
                <select name="cta_secondary_url" class="form-select form-select-sm" onchange="previewTargetSection(this.value)">
                    <option value="#">-- Pilih Target Section --</option>
                    {% for sec in page.sections %}
                        {% if sec.type not in ['navbar', 'footer'] %}
                            {% set sec_nav_id = sec.content.get('nav_id') or ('sec_' ~ sec.id) %}
                            {% set sec_title = sec.content.get('title') or sec.type|replace('_', ' ')|title %}
                            {% set target_url = '#' ~ sec_nav_id %}
                            <option value="{{ target_url }}" {% if section.content.get('cta_secondary_url') == target_url or section.content.get('button_link_2') == target_url %}selected{% endif %}>
                                📌 {{ sec_title }} ({{ sec.type }})
                            </option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="d-flex gap-2 pt-3 border-top">
        <button type="submit" class="btn btn-primary px-4 fw-medium">Simpan Perubahan Hero</button>
        <a href="{{ url_for('admin.manage_section', page_id=page.id) }}" class="btn btn-light border px-4 text-secondary">Batal</a>
    </div>
</form>

<script>
    function previewTargetSection(targetUrl) {
        if (typeof scrollToSectionInPreview === 'function' && targetUrl && targetUrl !== '#') {
            scrollToSectionInPreview('', targetUrl);
        }
    }
</script>
