<!-- FORM CTA -->
<form action="{{ url_for('admin.edit_section', section_id=section.id) }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

    <div class="p-4 border rounded-3 bg-light-subtle mb-4">
        <div class="mb-3">
            <label class="form-label fw-semibold">Judul CTA <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control" value="{{ section.content.get('title', 'Bergabung Bersama Kami') }}" required placeholder="Contoh: Mari Bergabung Bersama Kami">
        </div>

        <div>
            <label class="form-label fw-semibold">Subjudul</label>
            <textarea name="subtitle" class="form-control" rows="3" placeholder="Tulis kalimat ajakan singkat...">{{ section.content.get('subtitle', '') }}</textarea>
        </div>
    </div>

    {% set button = section.content.get('button', {}) %}
    <div class="p-4 border rounded-3 bg-white mb-4">
        <span class="fw-bold d-block mb-3">Tombol CTA</span>

        <div class="mb-3">
            <label class="form-label fw-semibold">Teks Tombol</label>
            <input type="text" name="button_text" class="form-control" value="{{ button.get('text', section.content.get('button_text', 'Selengkapnya')) }}" placeholder="Contoh: Selengkapnya">
        </div>

        <div>
            <label class="form-label fw-semibold">Target Tombol</label>
            <select name="button_url" class="form-select">
                <option value="#">-- Pilih Target Section --</option>
                {% for sec in page.sections %}
                    {% if sec.type not in ['navbar', 'footer'] %}
                        {% set sec_nav_id = sec.content.get('nav_id') or ('sec_' ~ sec.id) %}
                        {% set sec_title = sec.content.get('title') or sec.type|replace('_', ' ')|title %}
                        {% set target_url = '#' ~ sec_nav_id %}
                        <option value="{{ target_url }}" {% if button.get('url', section.content.get('button_url', '#')) == target_url %}selected{% endif %}>
                            {{ sec_title }} ({{ sec.type }})
                        </option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>
    </div>

    <div class="d-flex gap-2 pt-3 border-top">
        <button type="submit" class="btn btn-primary px-4">Simpan CTA</button>
        <a href="{{ url_for('admin.manage_section', page_id=page.id) }}" class="btn btn-light border px-4">Batal</a>
    </div>
</form>
