<!-- FORM FEATURES (CLEAN, AUTOMATIC DEFAULT ICON) -->
<form action="{{ url_for('admin.edit_section', section_id=section.id) }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

    <!-- JUDUL & SUBJUDUL -->
    <div class="mb-4">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Judul</label>
            <input type="text" name="title" class="form-control form-control-sm" value="{{ section.content.get('title', 'Keunggulan & Fasilitas Kami') }}" required placeholder="Contoh: Keunggulan Kami">
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Subjudul</label>
            <input type="text" name="subtitle" class="form-control form-control-sm" value="{{ section.content.get('subtitle', '') }}" placeholder="Deskripsi singkat...">
        </div>
    </div>

    <hr class="my-4 text-muted opacity-25">

    <!-- DAFTAR ITEM KEUNGGULAN -->
    <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="fw-semibold small text-dark">Daftar Poin Keunggulan</span>
            <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="addFeatureRow()">
                <i class="bi bi-plus-lg me-1"></i>Tambah Poin
            </button>
        </div>

        <div id="features-container" class="d-flex flex-column gap-3">
            {% set items = section.content.get('items', section.content.get('features', [])) %}
            {% for item in items %}
                {% set loop_idx = loop.index0 %}
                <div class="p-3 border rounded-3 bg-light-subtle feature-item-card position-relative">
                    
                    <!-- Tombol Hapus (Kanan Atas) -->
                    <button type="button" class="btn-close position-absolute top-0 end-0 m-3" onclick="this.closest('.feature-item-card').remove()" aria-label="Hapus" title="Hapus Poin"></button>

                    <!-- Hidden Input untuk Ikon Default -->
                    <input type="hidden" name="items[{{ loop_idx }}][icon]" value="{{ item.get('icon', 'bi-check-circle-fill') }}">

                    <div class="d-flex flex-column gap-2 pe-4">
                        <!-- 1. Judul Poin (Panjang) -->
                        <div>
                            <label class="form-label small text-muted mb-1">Judul Poin</label>
                            <input type="text" name="items[{{ loop_idx }}][title]" value="{{ item.get('title', '') }}" class="form-control form-control-sm" placeholder="Judul keunggulan...">
                        </div>

                        <!-- 2. Deskripsi / Keterangan (Panjang & Menurun) -->
                        <div>
                            <label class="form-label small text-muted mb-1">Keterangan / Deskripsi</label>
                            <textarea name="items[{{ loop_idx }}][description]" class="form-control form-control-sm" rows="2" placeholder="Penjelasan lengkap poin ini...">{{ item.get('description', item.get('desc', '')) }}</textarea>
                        </div>
                    </div>

                </div>
            {% endfor %}
        </div>
    </div>

    <!-- TOMBOL SIMPAN -->
    <div class="d-flex gap-2 pt-3 border-top">
        <button type="submit" class="btn btn-primary btn-sm px-4">Simpan</button>
        <a href="{{ url_for('admin.manage_section', page_id=section.page_id) }}" class="btn btn-light btn-sm border px-4">Batal</a>
    </div>
</form>

<script>
    let featureCounter = Date.now();

    function addFeatureRow() {
        const container = document.getElementById('features-container');
        const idx = featureCounter++;
        const html = `
            <div class="p-3 border rounded-3 bg-light-subtle feature-item-card position-relative">
                <button type="button" class="btn-close position-absolute top-0 end-0 m-3" onclick="this.closest('.feature-item-card').remove()" aria-label="Hapus" title="Hapus Poin"></button>
                
                <!-- Otomatis kirim nilai ikon default tanpa perlu diisi admin -->
                <input type="hidden" name="items[${idx}][icon]" value="bi-check-circle-fill">
                
                <div class="d-flex flex-column gap-2 pe-4">
                    <div>
                        <label class="form-label small text-muted mb-1">Judul Poin</label>
                        <input type="text" name="items[${idx}][title]" class="form-control form-control-sm" placeholder="Judul keunggulan...">
                    </div>
                    <div>
                        <label class="form-label small text-muted mb-1">Keterangan / Deskripsi</label>
                        <textarea name="items[${idx}][description]" class="form-control form-control-sm" rows="2" placeholder="Penjelasan lengkap poin ini..."></textarea>
                    </div>
                </div>
            </div>`;
        container.insertAdjacentHTML('beforeend', html);
    }
</script>
