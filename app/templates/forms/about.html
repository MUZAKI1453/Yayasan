<!-- FORM KHUSUS PROFIL / TENTANG KAMI (ABOUT) -->
<form action="{{ url_for('admin.edit_section', section_id=section.id) }}" method="POST" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

    <!-- JUDUL & NARRATIVE CONTENT -->
    <div class="p-3 border rounded-3 bg-light-subtle mb-4">
        <div class="row g-3">
            <div class="col-md-4">
                <label class="form-label fw-semibold small text-slate-700 mb-1">Label</label>
                <input type="text" name="eyebrow" class="form-control form-control-sm" value="{{ section.content.get('eyebrow', '') }}" placeholder="Contoh: TENTANG KAMI">
            </div>

            <div class="col-md-8">
                <label class="form-label fw-semibold small text-slate-700 mb-1">
                    Judul<span class="text-danger">*</span>
                </label>
                <input type="text" name="title" class="form-control form-control-sm" value="{{ section.content.get('title', 'Tentang Kami') }}" required placeholder="Contoh: Mengenal Lebih Dekat Sekolah Kami">
            </div>

            <div class="col-12">
                <label class="form-label fw-semibold small text-slate-700 mb-1">
                    Deskripsi Lengkap<span class="text-danger">*</span>
                </label>
                <textarea name="description" class="form-control form-control-sm" rows="5" placeholder="Tuliskan sejarah singkat, visi-misi, atau latar belakang lembaga/sekolah di sini...">{{ section.content.get('description', section.content.get('content', '')) }}</textarea>
            </div>
        </div>
    </div>

<!-- GAMBAR VISUAL PROFIL -->
    <div class="p-3 border rounded-3 bg-white mb-4">
        <label class="form-label fw-semibold small text-slate-700 mb-2">Gambar Visual Profil</label>
        
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label small text-muted mb-1">Upload Gambar Baru</label>
                <input type="file" name="image_file" class="form-control form-control-sm" accept="image/*">
            </div>
            
            <div class="col-12">
                <label class="form-label small text-muted mb-1">Caption (Opsional)</label>
                <input type="text" name="image_caption" class="form-control form-control-sm" value="{{ section.content.get('image_caption', '') }}" placeholder="Contoh: Gedung Utama Kampus A">
            </div>
        </div>

        {% set current_image = section.content.get('image') or section.content.get('image_url') or section.content.get('photo_url') %}
        {% if current_image %}
            <div class="d-flex align-items-center gap-3 p-2 bg-light border rounded-2 mt-3">
                <img src="{{ current_image }}" class="rounded border object-fit-cover" style="width: 80px; height: 60px;">
                <div class="lh-1">
                    <span class="d-block text-dark fw-medium small mb-1">Gambar Profil Saat Ini</span>
                    <span class="text-muted" style="font-size: 0.72rem;">Ditampilkan di sebelah kanan narasi tentang kami</span>
                    <!-- Hidden input disinkronkan ke name="image" -->
                    <input type="hidden" name="image" value="{{ current_image }}">
                </div>
            </div>
        {% endif %}
    </div>

    <!-- TOMBOL AKSI / CALL TO ACTION (OPSIONAL) -->
    <div class="p-3 border rounded-3 bg-white mb-4">
        <span class="fw-bold text-dark small d-block mb-3">TOMBOL CTA (OPSIONAL)</span>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label fw-medium small text-slate-700">Teks Tombol</label>
                <input type="text" name="button_text_1" class="form-control form-control-sm" value="{{ section.content.get('button_text_1', section.content.get('cta_text', '')) }}" placeholder="Contoh: Selengkapnya Tentang Kami">
            </div>
            <div class="col-md-6">
                <label class="form-label fw-medium small text-slate-700">Target Link</label>
                <select name="button_link_1" class="form-select form-select-sm" onchange="previewTargetSection(this.value)">
                    <option value="#">-- Pilih Target Bagian --</option>
                    {% for sec in page.sections %}
                        {% if sec.type not in ['navbar', 'footer'] %}
                            {% set sec_nav_id = sec.content.get('nav_id') or ('sec_' ~ sec.id) %}
                            {% set sec_title = sec.content.get('title') or sec.type|replace('_', ' ')|title %}
                            {% set target_url = '#' ~ sec_nav_id %}
                            <option value="{{ target_url }}" {% if section.content.get('button_link_1') == target_url or section.content.get('cta_url') == target_url %}selected{% endif %}>
                                📌 {{ sec_title }} ({{ sec.type }})
                            </option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
        </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="d-flex gap-2 pt-3 border-top">
        <button type="submit" class="btn btn-primary px-4 fw-medium">Simpan Profil</button>
        <a href="{{ url_for('admin.manage_section', page_id=page.id) }}" class="btn btn-light border px-4 text-secondary">Batal</a>
    </div>
</form>

<script>
    function previewTargetSection(targetUrl) {
        if (typeof scrollToSectionInPreview === 'function' && targetUrl && targetUrl !== '#') {
            scrollToSectionInPreview('', targetUrl);
        }
    }
</script>
