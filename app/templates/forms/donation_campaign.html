<!-- FORM DONATION CAMPAIGN (AUTOMATIC WA LINK) -->
<form action="{{ url_for('admin.edit_section', section_id=section.id) }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

    <!-- JUDUL & SUBJUDUL PROGRAM -->
    <div class="mb-4">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Label Kecil (Eyebrow)</label>
            <input type="text" name="eyebrow" class="form-control form-control-sm" value="{{ section.content.get('eyebrow', 'PROGRAM KEBAIKAN') }}" placeholder="Contoh: PROGRAM KEBAIKAN">
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Judul Program Donasi / Wakaf <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control form-control-sm" value="{{ section.content.get('title', 'Program Donasi & Wakaf') }}" required placeholder="Contoh: Wakaf Pembebasan Lahan">
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Deskripsi Program (Subtitle)</label>
            <textarea name="subtitle" class="form-control form-control-sm" rows="3" placeholder="Deskripsi mengenai peruntukan donasi dan urgensi program...">{{ section.content.get('subtitle', '') }}</textarea>
        </div>
    </div>

    <hr class="my-4 text-muted opacity-25">

    <!-- TARGET & CAPAIAN NOMINAL -->
    <div class="mb-4">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Target Nominal Dana (Rp)</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text">Rp</span>
                <input type="number" name="target" class="form-control form-control-sm" value="{{ section.content.get('target', section.content.get('target_amount', '')) }}" placeholder="500000000">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Dana Terkumpul Saat Ini (Rp)</label>
            <div class="input-group input-group-sm">
                <span class="input-group-text">Rp</span>
                <input type="number" name="collected" class="form-control form-control-sm" value="{{ section.content.get('collected', section.content.get('current_amount', section.content.get('raised_amount', ''))) }}" placeholder="150000000">
            </div>
        </div>
    </div>

    <hr class="my-4 text-muted opacity-25">

    <!-- INFORMASI REKENING & BANNER KONFIRMASI WHATSAPP -->
    <div class="mb-4">
        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Rekening Transfer Donasi</label>
            <input type="text" name="bank_account" class="form-control form-control-sm" value="{{ section.content.get('bank_account', section.content.get('bank_info', '')) }}" placeholder="Contoh: BSI 7123456789 a.n Yayasan Baitussalam">
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Teks Informasi Konfirmasi</label>
            <input type="text" name="confirm_info" class="form-control form-control-sm" value="{{ section.content.get('confirm_info', 'Konfirmasi transfer via Admin Keuangan Baitussalam:') }}" placeholder="Konfirmasi transfer via Admin Keuangan Baitussalam:">
        </div>

        <!-- FIELD NOMOR TELEPON ADMIN (LINK WA GENERATE OTOMATIS) -->
        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Nomor Telepon Admin Keuangan</label>
            <input type="text" name="admin_phone" class="form-control form-control-sm" value="{{ section.content.get('admin_phone', '0821-2924-1114') }}" placeholder="Contoh: 0821-2924-1114">
            <div class="form-text text-muted" style="font-size: 0.72rem;">*Link WhatsApp tombol konfirmasi akan dibuat otomatis berdasarkan nomor ini.</div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">Teks Tombol WA (CTA)</label>
            <input type="text" name="button_text" class="form-control form-control-sm" value="{{ section.content.get('button_text', 'Klik disini untuk konfirmasi') }}" placeholder="Klik disini untuk konfirmasi">
        </div>
    </div>

    <!-- TOMBOL AKSI SIMPAN -->
    <div class="d-flex gap-2 pt-3 border-top">
        <button type="submit" class="btn btn-primary btn-sm px-4">Simpan Program</button>
        <a href="{{ url_for('admin.manage_section', page_id=section.page_id) }}" class="btn btn-light btn-sm border px-4">Batal</a>
    </div>
</form>
