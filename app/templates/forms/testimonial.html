<!-- FORM TESTIMONIAL -->
<form action="{{ url_for('admin.edit_section', section_id=section.id) }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}">

    <div class="p-4 border rounded-3 bg-light-subtle mb-4">
        <div class="mb-3">
            <label class="form-label fw-semibold">Judul Testimonial <span class="text-danger">*</span></label>
            <input type="text" name="title" class="form-control" value="{{ section.content.get('title', 'Testimoni') }}" required placeholder="Contoh: Apa Kata Mereka?">
        </div>
        <div>
            <label class="form-label fw-semibold">Subjudul</label>
            <textarea name="subtitle" class="form-control" rows="2" placeholder="Deskripsi singkat tentang testimonial">{{ section.content.get('subtitle', '') }}</textarea>
        </div>
    </div>

    <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <span class="fw-bold d-block">Daftar Testimonial</span>
                <span class="text-muted small">Setiap testimonial hanya berisi nama dan quote.</span>
            </div>
            <button type="button" class="btn btn-sm btn-outline-primary" onclick="addTestimonialRow()">
                <i class="bi bi-plus-lg me-1"></i>Tambah
            </button>
        </div>

        <div id="testimonials-container" class="d-flex flex-column gap-4">
            {% set items = section.content.get('items', []) %}
            {% for item in items %}
                {% set idx = loop.index0 %}
                <div class="p-4 border rounded-3 bg-white testimonial-item-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-semibold">Testimonial {{ loop.index }}</span>
                        <button type="button" class="btn btn-sm btn-light text-danger border" onclick="removeTestimonialRow(this)">
                            <i class="bi bi-trash me-1"></i>Hapus
                        </button>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nama <span class="text-danger">*</span></label>
                        <input type="text" name="items[{{ idx }}][name]" value="{{ item.get('name', '') }}" class="form-control" required placeholder="Nama pemberi testimonial">
                    </div>
                    <div>
                        <label class="form-label">Quote <span class="text-danger">*</span></label>
                        <textarea name="items[{{ idx }}][quote]" class="form-control" rows="4" required placeholder="Tuliskan testimonial...">{{ item.get('quote', '') }}</textarea>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>

    <div class="d-flex gap-2 pt-3 border-top">
        <button type="submit" class="btn btn-primary px-4">Simpan Testimonial</button>
        <a href="{{ url_for('admin.manage_section', page_id=page.id) }}" class="btn btn-light border px-4">Batal</a>
    </div>
</form>

<script>
(function () {
    let testimonialCounter = {{ section.content.get('items', [])|length }};

    function reindexTestimonials() {
        document.querySelectorAll('#testimonials-container .testimonial-item-card').forEach((card, index) => {
            card.querySelectorAll('[name]').forEach(input => {
                input.name = input.name.replace(/items\[\d+\]/, `items[${index}]`);
            });
            const label = card.querySelector('.fw-semibold');
            if (label) label.textContent = `Testimonial ${index + 1}`;
        });
        testimonialCounter = document.querySelectorAll('#testimonials-container .testimonial-item-card').length;
    }

    window.removeTestimonialRow = function (button) {
        button.closest('.testimonial-item-card').remove();
        reindexTestimonials();
    };

    window.addTestimonialRow = function () {
        const container = document.getElementById('testimonials-container');
        const idx = testimonialCounter++;
        container.insertAdjacentHTML('beforeend', `
            <div class="p-4 border rounded-3 bg-white testimonial-item-card">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="fw-semibold">Testimonial ${idx + 1}</span>
                    <button type="button" class="btn btn-sm btn-light text-danger border" onclick="removeTestimonialRow(this)">
                        <i class="bi bi-trash me-1"></i>Hapus
                    </button>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nama <span class="text-danger">*</span></label>
                    <input type="text" name="items[${idx}][name]" class="form-control" required placeholder="Nama pemberi testimonial">
                </div>
                <div>
                    <label class="form-label">Quote <span class="text-danger">*</span></label>
                    <textarea name="items[${idx}][quote]" class="form-control" rows="4" required placeholder="Tuliskan testimonial..."></textarea>
                </div>
            </div>
        `);
        reindexTestimonials();
    };
})();
</script>
