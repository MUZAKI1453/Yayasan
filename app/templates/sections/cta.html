<section id="{{ section.content.get('nav_id', 'ppdb') }}" class="py-20 px-6 bg-blue-600 text-white text-center">
    <div class="max-w-4xl mx-auto">
        <h2 class="text-3xl md:text-4xl font-extrabold mb-4">
            {{ section.content.get('title', 'Segera Bergabung Bersama Kami') }}
        </h2>
        
        {% if section.content.get('subtitle') %}
            <p class="text-blue-100 text-lg mb-8 max-w-2xl mx-auto">
                {{ section.content.get('subtitle') }}
            </p>
        {% endif %}

        {% if section.content.get('button_text') %}
            <a href="{{ section.content.get('button_link', '#') }}" class="inline-block bg-white text-blue-600 hover:bg-blue-50 font-bold px-8 py-4 rounded-xl shadow-lg transition">
                {{ section.content.get('button_text') }}
            </a>
        {% endif %}
    </div>
</section>
